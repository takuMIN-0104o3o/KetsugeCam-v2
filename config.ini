# Path to the ONNX model (an .engine cache is built next to it on first run)
ModelPath = best.engine

# auto | v8 | v11 | v26
ModelVersion = auto

# half (FP16) or float (FP32)
Precision = half

# Size of the centre-screen ROI fed to the detector
CaptureWidth = 416
CaptureHeight = 416

# Minimum confidence for a detection to be kept
ConfidenceThreshold = 0.25

# Show a preview window with drawn detections (ESC to quit)
ShowPreview = true

# Comma-separated class names, in model output order.
# For a stock COCO-trained YOLOv8/v11 model:
Labels = none,ct_body,ct_head,t_body,t_head
